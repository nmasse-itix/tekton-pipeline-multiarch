apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: quarkus-getting-started-
spec:
  pipelineRef:
    name: quarkus-getting-started
  params:
  - name: git-url
    value: https://github.com/nmasse-itix/tekton-pipeline-multiarch.git
  - name: git-revision
    value: devoxx-france-2025
  - name: image-name
    value: quay.io/nmasse-redhat/quarkus-getting-started-multiarch
  - name: context-dir
    value: examples/quarkus/src
  - name: containerfile-path
    value: examples/quarkus/src/src/main/docker/Dockerfile.jvm
  workspaces:
  - name: oci-images
    volumeClaimTemplate:
      spec:
        storageClassName: efs-csi
        accessModes:
        - ReadWriteMany
        resources:
          requests:
            storage: 10Gi
  - name: sources
    volumeClaimTemplate:
      spec:
        storageClassName: efs-csi
        accessModes:
        - ReadWriteMany
        resources:
          requests:
            storage: 1Gi
  - name: maven-settings
    emptyDir: {}
  - name: registry-token
    secret:
      secretName: quay-authentication
  taskRunTemplate:
    serviceAccountName: buildbot
  taskRunSpecs:
  - pipelineTaskName: build-aarch64
    podTemplate:
      nodeSelector:
        beta.kubernetes.io/arch: arm64
      tolerations:
      - key: "emea-open-demo.redhat.com/arm64-architecture"
        operator: "Exists"
        effect: "NoSchedule"
